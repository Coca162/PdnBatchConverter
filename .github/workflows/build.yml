name: Build Release

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: windows-2025
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get Latest Paint.net Version
      id: show-pdn
      run: |
        $raw = winget show -s "winget" -e --id=dotPDN.PaintDotNet
        echo $raw
        $parsed = $raw | Select-String -Pattern '(?<=Version: ).*'
        $version = $parsed.Matches.Value
        echo $version
        echo "PDN_VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Cache Dotnet Libraries
      id: cache-dotnet
      uses: actions/cache@v4
      with:
        path: shared/libs
        key: ${{ hashFiles('shared/bridge', 'shared/openraster') }}-${{ steps.show-pdn.outputs.PDN_VERSION }}-dotnet9

    - name: Set dotnet skip
      run: echo "SKIP_DOTNET_BUILDING=${{ steps.cache-dotnet.outputs.cache-hit }}" >> $env:GITHUB_ENV

    - name: Install .NET Core
      if: steps.cache-dotnet.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Copy over libnethost to be cached
      if: steps.cache-dotnet.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $NetHost = Get-ChildItem -Path "C:\Program Files\dotnet\packs\Microsoft.NETCore.App.Host.win-x64"-Recurse -Include libnethost.lib | Select FullName | Select-Object -Last 1;
        New-Item -Type dir shared\libs
        Copy-Item $NetHost.FullName -Destination "shared\libs\libnethost.lib"

    - name: Install Paint.NET
      if: steps.cache-dotnet.outputs.cache-hit != 'true'
      run: winget install -h -s "winget" -e --id=dotPDN.PaintDotNet

    - name: Copy over libnethost to netcorehost
      run: cp "shared/libs/libnethost.lib" "libnethost.lib"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust caching
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release -F pdn-sys

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PdnBatchConverter-${{ github.sha }}
        path: target\release\*.exe