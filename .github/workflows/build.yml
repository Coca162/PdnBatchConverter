name: Build Release

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: windows-2025
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Paint.NET
      run: winget install -h -s "winget" -e --id=dotPDN.PaintDotNet

    - name: Build
      run: cargo build --release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PdnBatchConverter.exe
        path: target\release\ui-iced.exe

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PdnBatchConverter-Cli.exe
        path: target\release\cli.exe
